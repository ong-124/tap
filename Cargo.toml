[workspace]
members = [
    "sugarloaf",
    "teletypewriter",
    "corcovado",
    "tap-graphics",
    "tap-fonts",
    "tap-vt",
    "tap-backend",
    "tap-grapheme-width",
    "tap-unicode",
    "tap-window",
    "tap-grid",
    "frontends/tapterm",
    "libtap",
    "libtap-wasm",
    "libsugarloaf",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
rust-version = "1.100.0"
repository = "https://github.com/raphamorim/tap"
homepage = "https://tapterm.com"
documentation = "https://github.com/raphamorim/tap#readme"
readme = "README.md"

[workspace.dependencies]
teletypewriter = { path = "teletypewriter", version = "0.6.0" }
tap-backend = { path = "tap-backend", version = "0.6.0" }
tap-window = { path = "tap-window", version = "0.6.0", default-features = false }
tap-grapheme-width = { path = "tap-grapheme-width", version = "0.6.0" }
sugarloaf = { path = "sugarloaf", version = "0.6.0" }
corcovado = { path = "corcovado", version = "0.6.0" }
tap-graphics = { path = "tap-graphics", version = "0.6.0" }
tap-fonts = { path = "tap-fonts", version = "0.6.0" }
tap-vt = { path = "tap-vt", version = "0.6.0" }
tap-grid = { path = "tap-grid", version = "0.6.0" }
tap-unicode = { path = "tap-unicode", version = "0.6.0" }

raw-window-handle = { version = "0.6.2", features = ["std"] }
parking_lot = { version = "0.12.5", features = [
    "nightly",
    "hardware-lock-elision",
] }
rustc-hash = "2.1.3"
smallvec = { version = "1.15.2", default-features = false }
simdutf = "0.7.0"
base64 = "0.23.1"
image_rs = { package = "image", version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "ico",
    "png",
    "pnm",
    "webp",
    "bmp",
    "tiff",
] }
regex = "1.13.1"
onig = { version = "6.5.3", default-features = false }
onig_sys = { version = "69.9.3", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30.0.2"
libc = "0.2.191"
smol_str = "0.3.7"
futures = "0.3.34"
zbus = "4.4.0"
bitflags = "2.9.0"
tracing = "0.1.41"
objc = { package = "objc-rs", version = "0.3.2" }
memmap2 = "0.9.11"
url = "2.5.4"
criterion = { version = "0.6.0", features = ["html_reports"] }
dashmap = "6.2.1"
flate2 = "1.1.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
debug = "full"              # No one needs an undebuggable release binary
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
lto = true
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
codegen-units = 1
incremental = false

[profile.libtap]
inherits = "release"
strip = "none"
debug = false
lto = false

[profile.dev]
split-debuginfo = "unpacked"
lto = false
opt-level = 0
incremental = true