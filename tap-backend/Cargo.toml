[package]
name = "tap-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/tap"
documentation = "https://github.com/raphamorim/tap#readme"
description = "Backend infrastructure for Tap terminal"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = { workspace = true }

# Most of the former dependencies (corcovado, copypasta, onig-based search,
# simd, image_rs, …) moved with the terminal core to `tap-vt`. What remains
# here is config loading + the sugarloaf renderer glue.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = "0.9.2"
base64 = { workspace = true }
regex = { workspace = true }
dirs = "6.0.0"
serde = { workspace = true }
tap-graphics = { workspace = true, features = ["glyph"] }
tap-vt = { workspace = true }
sugarloaf = { workspace = true, optional = true }
# `wgpu` is only needed when the corresponding sugarloaf feature is on.
wgpu = { workspace = true, optional = true }
tap-window = { workspace = true, optional = true }

# `onig` only backs the hint-regex unit tests; runtime search lives in tap-vt.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
onig = { workspace = true }

[features]
default = ["renderer", "wayland", "x11", "tap-window", "graphics"]
# The renderer (sugarloaf) backend. Off makes tap-backend a lean terminal
# core with no GPU/font-shaping deps — this is what `libtap` embeds.
renderer = ["dep:sugarloaf", "tap-vt/renderer"]
# Image (sixel/kitty/iTerm2) and glyph protocol decoding. On for the desktop
# frontend; off for lean headless embeds (libtap).
graphics = ["tap-vt/graphics"]
# Tap's window layer (tap-window, a winit fork). Pulls in the window types
# and bridges the core's WindowId to tap-window at the frontend boundary.
tap-window = ["dep:tap-window", "tap-vt/tap-window"]
x11 = ["tap-vt/x11"]
wayland = ["tap-vt/wayland"]
# Enable the wgpu backend in sugarloaf (needed on Windows where the
# native Vulkan/Metal backends aren't available, and as an opt-in for
# librashader CRT/scanline filters on Linux/macOS). Implies `renderer`.
wgpu = ["renderer", "dep:wgpu", "sugarloaf/wgpu", "tap-vt/wgpu"]
